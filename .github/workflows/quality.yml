name: Quality validation

# GitHub Actions is temporarily manual because the account is locked
# for a billing issue. Re-enable push/pull_request after billing is restored.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'ci-placeholder-key'
      SUPABASE_SERVICE_ROLE_KEY: 'ci-placeholder-service-role-key'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
